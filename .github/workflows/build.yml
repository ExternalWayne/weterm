name: Build Weterm

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Frontend build
        run: |
          npm install
          npm run build
      - name: Rust check (both targets)
        run: |
          cd src-tauri
          cargo check --target aarch64-apple-darwin
          cargo check --target x86_64-apple-darwin
      - name: Rust tests
        run: |
          cd src-tauri
          cargo test
