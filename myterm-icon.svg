<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 120 120">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 纯黑背景 -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="#000000" filter="url(#shadow)"/>

  <!-- 顶部标题栏 -->
  <rect x="16" y="16" width="88" height="24" rx="22" fill="#0a0a0a"/>
  <rect x="16" y="28" width="88" height="12" fill="#0a0a0a"/>

  <!-- 三色窗口按钮 -->
  <circle cx="28" cy="28" r="3.5" fill="#ef4444"/>
  <circle cx="39" cy="28" r="3.5" fill="#f59e0b"/>
  <circle cx="50" cy="28" r="3.5" fill="#10b981"/>

  <!-- >_ 符号 -->
  <text x="42" y="66" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" 
        font-size="28" font-weight="700" fill="#f8fafc">&gt;</text>
  <rect x="66" y="52" width="4" height="16" rx="1" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- 底部装饰线 1 -->
  <rect x="28" y="82" width="64" height="2.5" rx="1.25" fill="#334155"/>

  <!-- 底部装饰线 2 -->
  <rect x="28" y="90" width="30" height="2.5" rx="1.25" fill="#475569"/>

  <!-- 青色光标（占行宽 1/3，闪烁） -->
  <rect x="58" y="90" width="14" height="2.5" rx="1.25" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>